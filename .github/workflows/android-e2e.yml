name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # Stage 1
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Stage 3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      # Stage 5
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Stage 6
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Stage 7-17
      - name: Run E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim
          script: |
            bash <<'BASH'
            set -euo pipefail

            echo "========== Stage 7: Verifying Emulator Readiness =========="
            echo "Starting ADB Server..."
            adb kill-server || true
            adb start-server
            adb devices

            EMULATOR_ID="emulator-5554"
            echo "Waiting for emulator ${EMULATOR_ID} to show up as ONLINE..."
            for i in $(seq 1 60); do
              if adb devices | grep -E "${EMULATOR_ID}\s+device" >/dev/null 2>&1; then
                echo "Emulator ${EMULATOR_ID} is online!"
                break
              fi
              echo "Attempt $i: emulator not ready yet..."
              adb devices || true
              sleep 5
            done

            echo "Waiting for Android boot_completed..."
            for i in $(seq 1 60); do
              boot=$(adb -s ${EMULATOR_ID} shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              echo "Boot Check $i: '$boot'"
              if [ "$boot" = "1" ]; then
                echo "Android Emulator Boot Completed Successfully!"
                break
              fi
              sleep 5
            done

            if [ "$(adb devices | awk 'NR>1{print $2}' | grep -c device || true)" -eq 0 ]; then
              echo "Emulator did not come up in time. Current adb devices:"
              adb devices || true
              exit 1
            fi

            echo "Disabling window animations..."
            adb -s ${EMULATOR_ID} shell settings put global window_animation_scale 0 || true
            adb -s ${EMULATOR_ID} shell settings put global transition_animation_scale 0 || true
            adb -s ${EMULATOR_ID} shell settings put global animator_duration_scale 0 || true

            echo "========== Stage 8: Installing Built APK =========="
            adb -s ${EMULATOR_ID} install -r app/build/outputs/apk/debug/app-debug.apk

            echo "========== Stage 9: Starting Appium Server =========="
            npm install -g appium
            appium driver install uiautomator2 || true

            echo "Launching Appium in background..."
            appium --log appium_server.log > appium_console.log 2>&1 &
            sleep 15
            curl -s --fail http://127.0.0.1:4723/status || (echo "Appium health check failed"; tail -n 50 appium_console.log || true)

            echo "========== Stage 10-17: Executing E2E Tests & Generating Reports =========="
            cd automation
            npm install
            npm test
            BASH


      # Stage 18
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Execution-Reports
          retention-days: 30
          path: |
            automation/Test Results/
            automation/screenshots/
            automation/logs/
            appium_server.log
            appium_console.log

      # Stage 19
      - name: Publish Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports
          destination_dir: reports

      # Stage 20
      - name: Publish Action Summary
        if: always()
        shell: bash
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Android Appium E2E Execution Completed" >> "$GITHUB_STEP_SUMMARY"
          fi
