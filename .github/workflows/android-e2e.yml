name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily midnight run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: Setup Android SDK
        uses: actions/setup-android@v3

      # Stage 4: Install Node.js & Dependencies
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      # Stage 5: Build APK
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            echo "Stage 7: Verifying Emulator Readiness..."
            adb wait-for-device
            adb shell getprop sys.boot_completed

            echo "Stage 8: Installing Built APK..."
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "Stage 9 & 10: Starting Appium Server & Verifying Health..."
            npm install -g appium
            appium driver install uiautomator2
            appium --log appium_server.log &
            sleep 10
            curl -s http://127.0.0.1:4723/status || true

            echo "Stage 11-17: Executing Appium E2E Tests & Generating Reports..."
            cd automation
            npm test

      # Stage 18: Upload Artifacts
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Execution-Reports
          path: |
            automation/Test Results/
            automation/screenshots/
            automation/logs/
            appium_server.log
          retention-days: 30

      # Stage 19 & 20: Publish Reports to GitHub Pages & Archive History
      - name: Publish Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports
          destination_dir: reports

      # Stage 21: Publish GitHub Action Summary
      - name: Publish Action Summary
        if: always()
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## E2E Execution Completed" >> $GITHUB_STEP_SUMMARY
          fi
