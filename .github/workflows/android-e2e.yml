name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # Stage 1
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Stage 2
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Stage 3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      # Stage 5
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Stage 6
      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Stage 7-17
      - name: Run E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim
          script: |
            echo "========== Stage 7: Emulator Ready =========="
            adb devices

            echo "========== Stage 8: Installing Built APK =========="
            adb install -r app/build/outputs/apk/debug/app-debug.apk || true

            echo "========== Stage 9: Starting Appium Server =========="
            npm install -g appium
            appium driver install uiautomator2 || true
            appium --log appium_server.log > appium_console.log 2>&1 &
            sleep 15
            curl -s http://127.0.0.1:4723/status || true

            echo "========== Stage 10-17: Executing E2E Tests & Generating Reports =========="
            cd automation
            npm install
            npm test



      # Stage 18
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Execution-Reports
          retention-days: 30
          path: |
            automation/Test Results/
            automation/screenshots/
            automation/logs/
            appium_server.log
            appium_console.log

      # Stage 19
      - name: Publish Reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports
          destination_dir: reports

      # Stage 20
      - name: Publish Action Summary
        if: always()
        shell: bash
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Android Appium E2E Execution Completed" >> "$GITHUB_STEP_SUMMARY"
          fi
