name: Live CI/CD Deployment & E2E Testing Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://praveenac4272.github.io/SMART-CAREER-PATH/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Application APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify Live Deployment Endpoint
        run: |
          echo "Verifying live deployment at $BASE_URL..."
          curl -s -o /dev/null -w "%{http_code}" $BASE_URL || true

      - name: Execute 2000+ Test Suite & Generate Reports
        run: |
          cd automation
          npm install
          npm test

      - name: Upload All Test & Security Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Full-Security-And-Test-Artifacts
          path: |
            automation/Test Results/
            Vulnerability Test Results/
          retention-days: 30

      - name: Publish Action Summary
        if: always()
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
