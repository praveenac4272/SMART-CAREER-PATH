services:
  - type: web
    name: smart-career-backend
    env: python
    region: oregon
    buildCommand: pip install -r smart-career-frontend/backend/requirements.txt
    startCommand: gunicorn --chdir smart-career-frontend/backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: CAREER_DB_PATH
        value: smart-career-frontend/backend/career_backend.db

  - type: web
    name: smart-career-frontend
    env: static
    buildCommand: cd smart-career-frontend && npm install && npm run build
    staticPublishPath: smart-career-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-career-backend
          property: host
